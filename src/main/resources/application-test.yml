server:
  port: ${PORT}

spring:
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss
  application:
    name: reminisce
  datasource:
    url: ${RDB_URL}
    username: ${RDB_USERNAME}
    password: ${RDB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL}
    open-in-view: ${OPEN_IN_VIEW}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SZIE}
      max-request-size: ${MAX_REQUEST_SIZE}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLE}
    path: ${API_DOCS_PATH}
    version: openapi_3_0
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLE}
  writer-with-default-pretty-printer: ${SWAGGER_UI_WRITER_WITH_DEFAULT_PRETTY_PRINTER}

jwt:
  access-token-expired: ${ACCESS_TOKEN_EXPIRED}
  refresh-token-expired: ${REFRESH_TOKEN_EXPIRED}
  secret:
    key: ${JWT_SECRET_KEY}

file:
  storage:
    path: ${FILE_STORAGE_PATH}
    cache-period: ${FILE_STORAGE_CACHE_PERIOD}

child:
  policy:
    max-per-guardian: ${CHILD_MAX_PER_GUARDIAN}

LOG_HOST: ${LOG_HOST}
LOG_INDEX_ID: ${LOG_INDEX_ID}
NODE_ID: ${NODE_ID}
